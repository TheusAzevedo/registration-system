<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Cadastro - Meu Sistema</title>
    <!-- Bootstrap via CDN (corrigi o link que estava quebrado) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    
    <!-- Cabeçalho com botão de voltar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Editando: {{ pessoa.nome }}</h2>
        <a href="/" class="btn btn-outline-secondary btn-sm">Voltar pra Lista</a>
    </div>

    <!-- Avisos de erro do Flask -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" value="{{ pessoa.nome }}" class="form-control" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Sobrenome</label>
                    <input type="text" name="sobrenome" value="{{ pessoa.sobrenome }}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Idade</label>
                    <input type="number" name="idade" value="{{ pessoa.idade }}" min="0" max="130" class="form-control" required>
                </div>
                
                <div class="col-md-4">
                    <label class="form-label">País</label>
                    <select name="iso_pais" id="pais" class="form-select" required>
                        {% for p in paises %}
                            <option value="{{ p.iso_code }}" {% if p.iso_code == pessoa.iso_pais %}selected{% endif %}>
                                {{ p.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <!-- O JS vai preencher isso aqui embaixo -->
                    <select name="estado" id="estado" class="form-select" required></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <select name="cidade" id="cidade" class="form-select" required></select>
                </div>
                
                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" value="{{ pessoa.telefone }}" class="form-control" required>
                </div>
                
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success px-4">Salvar Alterações</button>
                    <a href="/" class="btn btn-light border px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Pega os elementos da tela
    const paisSelect = document.getElementById("pais");
    const estadoSelect = document.getElementById("estado");
    const cidadeSelect = document.getElementById("cidade");

    // Pega os dados que vieram do banco pra marcar como "selected"
    const estadoAtual = "{{ pessoa.sigla_estado }}|{{ pessoa.estado }}";
    const cidadeAtual = "{{ pessoa.cidade }}";

    console.log("Dados atuais pra carregar:", estadoAtual, cidadeAtual);

    async function buscarEstados(ehInicial = false) {
        const iso = paisSelect.value;
        
        // Limpa o select enquanto carrega
        estadoSelect.innerHTML = '<option value="">Carregando...</option>';
        cidadeSelect.innerHTML = '<option value="">Esperando estado...</option>';

        try {
            const res = await fetch(`/api/estados/${iso}`);
            const estados = await res.json();

            estadoSelect.innerHTML = ""; // limpa de novo
            
            estados.forEach(est => {
                const val = `${est.iso_code}|${est.name}`;
                
                // Se for a primeira carga da página, tenta achar o estado que já estava salvo
                let selecionado = "";
                if (ehInicial && val === estadoAtual) {
                    selecionado = "selected";
                }
                
                estadoSelect.innerHTML += `<option value="${val}" ${selecionado}>${est.iso_code} - ${est.name}</option>`;
            });

            // Chama a função de cidade automaticamente
            await buscarCidades(ehInicial);

        } catch (erro) {
            console.error("Deu erro ao buscar os estados:", erro);
        }
    }

    async function buscarCidades(ehInicial = false) {
        const iso = paisSelect.value;
        const valorEstado = estadoSelect.value;

        if (!valorEstado) return; // se não tem estado, nem faz o fetch

        const [uf, nomeEstado] = valorEstado.split("|");
        
        cidadeSelect.innerHTML = '<option value="">Carregando cidades...</option>';

        try {
            const res = await fetch(`/api/cidades/${iso}/${uf}/${encodeURIComponent(nomeEstado)}`);
            const cidades = await res.json();

            cidadeSelect.innerHTML = ""; 
            
            cidades.forEach(cid => {
                // Mesma lógica pra marcar a cidade salva
                let selecionado = "";
                if (ehInicial && cid === cidadeAtual) {
                    selecionado = "selected";
                }
                
                cidadeSelect.innerHTML += `<option value="${cid}" ${selecionado}>${cid}</option>`;
            });

        } catch (erro) {
            console.error("Erro ao buscar cidades:", erro);
            cidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    // Eventos de mudança
    paisSelect.addEventListener("change", () => buscarEstados(false));
    estadoSelect.addEventListener("change", () => buscarCidades(false));

    // Gambiarra pra rodar a função assim que a página abrir
    // (O true significa que é a carga inicial, pra marcar o que já vem do banco)
    window.addEventListener('DOMContentLoaded', () => {
        buscarEstados(true);
    });
</script>
</body>
</html>
