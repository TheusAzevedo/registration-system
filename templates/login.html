<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container" style="max-width: 400px;">
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-3 text-center">Restricted Access</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Administrator Password</label>
                    <input type="password" name="password" class="form-control" required autofocus>
                </div>
                <button type="submit" class="btn btn-dark w-100">Sign In</button>
                <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none">Back to Registration</a>
            </form>
        </div>
    </div>

    <footer class="py-4 mt-4 border-top">
        <div class="d-flex justify-content-center align-items-center gap-2 text-muted">
            <img src="{{ url_for('static', filename='img/crest.png') }}"
                 alt="Crest"
                 class="rounded shadow-sm"
                 style="height: 36px; width: auto; object-fit: contain;">
            <span class="small">&copy; 2026 MEI System. All rights reserved.</span>
        </div>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
