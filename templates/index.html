<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Cadastros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Gerenciar Cadastros</h2>
        <span class="text-muted fw-semibold">MEI System</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold py-3">Novo Cadastro</div>
        <div class="card-body p-4">
            <form action="/register" method="POST" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" name="first_name" class="form-control" placeholder="Só o primeiro nome" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Sobrenome</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Sobrenome completo" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Idade</label>
                    <input type="number" name="age" min="0" max="130" class="form-control" placeholder="Ex: 30" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">País</label>
                    <select name="country_iso" id="select-country" class="form-select" required>
                        <option value="">Selecione o país...</option>
                        {% for c in countries %}
                            {# A lib às vezes retorna iso_code, às vezes iso2. Vai entender... #}
                            {% set code = c.iso_code if c.iso_code is defined else c.iso2 %}
                            {% set ddi = (c.phone_code if c.phone_code is defined else c.phonecode) | string %}
                            <option value="{{ code }}">
                                {{ c.name }} (+{{ ddi.lstrip('+') }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <select name="state" id="select-state" class="form-select" required disabled>
                        <option value="">Escolha o país primeiro</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <select name="city" id="select-city" class="form-select" required disabled>
                        <option value="">Escolha o estado primeiro</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="phone" class="form-control" placeholder="DDD + Número" required>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary px-4">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="py-4 mt-5 border-top">
        <div class="d-flex justify-content-center align-items-center gap-2 text-muted">
            <img src="{{ url_for('static', filename='img/crest.png') }}"
                 alt="Brasão"
                 class="rounded shadow-sm"
                 style="height: 36px; width: auto; object-fit: contain;">
            <span class="small">&copy; 2026 Matheus Dias. Todos os direitos reservados.</span>
        </div>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Lógica pra carregar estado/cidade dependendo do país
    const countrySelect = document.getElementById("select-country");
    const stateSelect = document.getElementById("select-state");
    const citySelect = document.getElementById("select-city");

    async function loadStates() {
        const iso = countrySelect.value;

        // Limpa os campos de baixo
        stateSelect.innerHTML = '<option value="">Buscando estados...</option>';
        stateSelect.disabled = true;
        citySelect.innerHTML = '<option value="">Escolha o estado primeiro</option>';
        citySelect.disabled = true;

        if (!iso) {
            stateSelect.innerHTML = '<option value="">Escolha o país primeiro</option>';
            return;
        }

        try {
            const res = await fetch(`/api/states/${iso}`);
            const states = await res.json();

            stateSelect.innerHTML = '<option value="">Selecione o estado...</option>';
            
            states.forEach(st => {
                stateSelect.innerHTML += `<option value="${st.iso_code}|${st.name}">${st.name}</option>`;
            });
            
            stateSelect.disabled = false;
        } catch (e) {
            console.log("Deu erro ao buscar os estados:", e);
        }
    }

    async function loadCities() {
        const iso = countrySelect.value;
        const val = stateSelect.value;

        citySelect.innerHTML = '<option value="">Buscando cidades...</option>';
        citySelect.disabled = true;

        if (!val) {
            citySelect.innerHTML = '<option value="">Escolha o estado primeiro</option>';
            return;
        }

        // Separa a UF do nome (que vem no formato "UF|Nome")
        const partes = val.split("|");
        const stateCode = partes[0];
        const stateName = partes[1];

        try {
            const res = await fetch(`/api/cities/${iso}/${stateCode}/${encodeURIComponent(stateName)}`);
            const cities = await res.json();

            citySelect.innerHTML = '<option value="">Selecione a cidade...</option>';
            
            cities.forEach(cid => {
                citySelect.innerHTML += `<option value="${cid}">${cid}</option>`;
            });
            
            citySelect.disabled = false;
        } catch (e) {
            console.log("Deu pau ao carregar as cidades:", e);
        }
    }

    countrySelect.addEventListener("change", loadStates);
    stateSelect.addEventListener("change", loadCities);

    // Se recarregar a página com erro, mantém os estados carregados
    if (countrySelect.value) {
        loadStates();
    }
</script>
</body>
</html>
