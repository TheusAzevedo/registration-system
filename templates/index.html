<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros - Meu Sistema</title>
    <!-- Bootstrap via CDN (link corrigido) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Gerenciar Cadastros</h2>
        <span class="text-muted">MEI System</span>
    </div>

    <!-- Flash messages do Flask (erros e sucessos) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    <!-- Card do Formulário -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white fw-bold py-3">Novo Cadastro</div>
        <div class="card-body p-4">
            <form action="/cadastrar" method="POST" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control" placeholder="Só o primeiro nome" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Sobrenome</label>
                    <input type="text" name="sobrenome" class="form-control" placeholder="Sobrenome completo" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Idade</label>
                    <input type="number" name="idade" min="0" max="130" class="form-control" placeholder="Ex: 30" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">País</label>
                    <select name="iso_pais" id="select-pais" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for p in paises %}
                            <option value="{{ p.iso_code }}">
                                {{ p.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Estado</label>
                    <select name="estado" id="select-estado" class="form-select" required disabled>
                        <option value="">Escolha o país primeiro</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <select name="cidade" id="select-cidade" class="form-select" required disabled>
                        <option value="">Escolha o estado primeiro</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" class="form-control" placeholder="DDD + Número" required>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary px-4">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Aqui entra a tabela de listagem (não coloquei pois não veio no arquivo) -->
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mapeando os selects
    const selectPais = document.getElementById("select-pais");
    const selectEstado = document.getElementById("select-estado");
    const selectCidade = document.getElementById("select-cidade");

    // Quando muda o país, busca os estados no back-end
    selectPais.addEventListener("change", async () => {
        const iso = selectPais.value;

        // Reseta os campos de baixo
        selectEstado.innerHTML = '<option value="">Buscando estados...</option>';
        selectEstado.disabled = true;
        selectCidade.innerHTML = '<option value="">Escolha o estado primeiro</option>';
        selectCidade.disabled = true;

        if (!iso) {
            selectEstado.innerHTML = '<option value="">Escolha o país primeiro</option>';
            return;
        }

        try {
            const res = await fetch(`/api/estados/${iso}`);
            const estados = await res.json();

            // Monta as options na mão (jeito mais rápido)
            selectEstado.innerHTML = '<option value="">Selecione o estado...</option>';
            estados.forEach(est => {
                selectEstado.innerHTML += `<option value="${est.iso_code}|${est.name}">${est.iso_code} - ${est.name}</option>`;
            });
            
            selectEstado.disabled = false;
        } catch (erro) {
            console.log("Deu erro ao buscar estados:", erro);
            selectEstado.innerHTML = '<option value="">Erro ao carregar. Tente de novo.</option>';
        }
    });

    // Quando muda o estado, busca as cidades
    selectEstado.addEventListener("change", async () => {
        const iso = selectPais.value;
        const valorEstado = selectEstado.value;

        selectCidade.innerHTML = '<option value="">Buscando cidades...</option>';
        selectCidade.disabled = true;

        if (!valorEstado) {
            selectCidade.innerHTML = '<option value="">Escolha o estado primeiro</option>';
            return;
        }

        // Separa a UF do nome (que veio lá do validator.py como "UF|Nome")
        const [uf, nomeEstado] = valorEstado.split("|");

        try {
            const res = await fetch(`/api/cidades/${iso}/${uf}/${encodeURIComponent(nomeEstado)}`);
            const cidades = await res.json();

            selectCidade.innerHTML = '<option value="">Selecione a cidade...</option>';
            cidades.forEach(cid => {
                selectCidade.innerHTML += `<option value="${cid}">${cid}</option>`;
            });
            
            selectCidade.disabled = false;
        } catch (erro) {
            console.log("Deu ruim ao buscar cidades:", erro);
            selectCidade.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    });
</script>
</body>
</html>
